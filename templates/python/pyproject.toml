[project]
name = "python-starter"
version = "0.1.0"
description = "Python project managed with uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
app = "app.__main__:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
