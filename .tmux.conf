set -g default-terminal "screen-256color"
set-option -g focus-events on

# Windows start at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Prefix: Ctrl+Space. C-@ is what some terminals send for Ctrl+Space.
set-option -g prefix C-Space
set-option -g prefix2 C-@
unbind-key C-b
bind-key C-Space send-prefix
bind-key C-@ send-prefix

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

set -g default-shell /bin/zsh

set -g mouse on

# Copy mode: Emacs (as shown in the cheatsheet)
setw -g mode-keys emacs

# Panes
bind-key - split-window -v -c "#{pane_current_path}"
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key o select-pane -t :.+
bind-key ';' last-pane
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5
bind-key ! break-pane
bind-key x confirm-before -p "Kill pane #P? (y/n)" kill-pane

# Windows
bind-key c new-window -c "#{pane_current_path}"
bind-key n next-window
bind-key p previous-window
bind-key "'" command-prompt -p "window name" "select-window -t ':%%'"
bind-key . command-prompt -p "new index" "move-window -t '%%'"
bind-key , command-prompt -I "#W" "rename-window '%%'"
bind-key f command-prompt "find-window '%%'"
bind-key '&' confirm-before -p "Kill window #W? (y/n)" kill-window
bind-key w list-windows

# Sessions
bind-key '$' command-prompt -I "#S" "rename-session '%%'"
bind-key d detach-client
bind-key ')' switch-client -n
bind-key '(' switch-client -p

# Copy mode (entry/paste buffer)
bind-key [ copy-mode
bind-key ] paste-buffer

# Emacs copy-mode commands
bind-key -T copy-mode C-Space send -X begin-selection
bind-key -T copy-mode C-w send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode C-g send -X clear-selection
bind-key -T copy-mode M-< send -X history-top
bind-key -T copy-mode M-> send -X history-bottom
bind-key -T copy-mode C-s send -X search-forward
bind-key -T copy-mode n send -X search-again
bind-key -T copy-mode q send -X cancel
bind-key -T copy-mode PageUp send -X page-up
bind-key -T copy-mode PageDown send -X page-down

# Status bar
set -g status-position bottom
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left " #[fg=#b8bb26,bold]#S #[fg=#504945]│ "
set -g status-left-length 30
set -g status-right "#[fg=#83a598]%H:%M #[fg=#504945]│ #[fg=#fabd2f]%d %b "
set -g status-right-length 40
set -g window-status-format "#[fg=#504945] #I #W "
set -g window-status-current-format "#[bg=#504945,fg=#ebdbb2,bold] #I #W "
