# Gruvbox Dark: terminal background #282828, selection soft #32302f.
gui:
  colorScheme: dark
  theme:
    activeBorderColor: ['#b8bb26', bold]
    inactiveBorderColor: ['#504945']
    searchingActiveBorderColor: ['#fabd2f', bold]
    optionsTextColor: ['#83a598']
    defaultFgColor: ['#ebdbb2']
    selectedLineFgColor: ['#ebdbb2']
    selectedLineBgColor: ['#32302f']
    inactiveViewSelectedLineBgColor: ['#32302f']
    cherryPickedCommitFgColor: ['#282828']
    cherryPickedCommitBgColor: ['#8ec07c']
    markedBaseCommitFgColor: ['#282828']
    markedBaseCommitBgColor: ['#fabd2f']
    unstagedChangesColor: ['#fb4934']
    authorColors:
      '*': '#d3869b'
    branchColorPatterns:
      '^': '#83a598'
